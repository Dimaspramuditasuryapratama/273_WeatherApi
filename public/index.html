<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
            font-family: "Press Start 2P", monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #f4f0ff;
            /* langit malam + kotak-kotak ala peta game */
            background:
                linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 32px 32px,
                linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 32px 32px,
                linear-gradient(#1a1040, #3a1c6e);
        }
        .box {
            max-width: 560px;
            margin: 0 auto;
            padding: 20px;
            background: #120a2e;
            border: 4px solid #ffd84d;
            box-shadow: 8px 8px 0 #000;
        }
        h1 { font-size: 18px; color: #ffd84d; margin: 0 0 16px; }
        h3 { font-size: 10px; margin: 4px 0; color: #9be7ff; }
        input {
            width: 100%;
            box-sizing: border-box;
            margin: 16px 0 10px;
            padding: 12px;
            font: inherit;
            color: #fff;
            background: #000;
            border: 3px solid #9be7ff;
        }
        button {
            width: 100%;
            padding: 12px;
            font: inherit;
            color: #000;
            background: #ff5c8a;
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            cursor: pointer;
        }
        button:active { transform: translate(4px, 4px); box-shadow: none; }
        .hasil { margin-top: 20px; }
        p { margin: 10px 0; }
        p span { color: #7dff9b; word-break: break-word; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Peta Petualang</h1>

        <h3>Nama : Dimas Pramudita Surya Pratama</h3>
        <h3>NIM : 20240140273</h3>

        <input id="lokasi" placeholder="Masukkan lokasi" value="Yogyakarta">
        <button onclick="cari()">Mulai Cari</button>

        <div class="hasil">
            <p>Lokasi : <span id="hLokasi"></span></p>
            <p>Negara : <span id="hNegara"></span></p>
            <p>Provinsi : <span id="hProvinsi"></span></p>
            <p>Kecamatan : <span id="hKecamatan"></span></p>
            <p>Longitude : <span id="hLon"></span></p>
            <p>Latitude : <span id="hLat"></span></p>
        </div>
    </div>

    <script>
        function cari() {
            const q = document.getElementById("lokasi").value;

            fetch("/api/lokasi?q=" + encodeURIComponent(q))
                .then(res => res.json())
                .then(data => {
                    document.getElementById("hLokasi").innerText = data.lokasi;
                    document.getElementById("hNegara").innerText = data.negara;
                    document.getElementById("hProvinsi").innerText = data.provinsi;
                    document.getElementById("hKecamatan").innerText = data.kecamatan;
                    document.getElementById("hLon").innerText = data.longitude;
                    document.getElementById("hLat").innerText = data.latitude;
                })
                .catch(() => alert("Lokasi tidak ditemukan"));
        }
    </script>
</body>
</html>
